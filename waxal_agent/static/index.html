<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaxalAgent</title>
<style>
  :root { --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; --line:#dcdcd4; --card:#fff; --accent:#0a7d5a; --danger:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ecece6; --muted:#9a9a92; --line:#33332f; --card:#1f1f1c; --accent:#3ec79a; --danger:#f2b8b5; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.3rem; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  #talk { width:100%; padding:22px; font-size:1.1rem; border-radius:14px; border:1px solid var(--line); background:var(--card);
          color:var(--fg); cursor:pointer; touch-action:none; user-select:none; }
  #talk.rec { background:var(--danger); color:#fff; border-color:var(--danger); }
  #talk:disabled { opacity:.6; cursor:default; }
  form { display:flex; gap:8px; margin:12px 0 20px; }
  input[type=text] { flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  button.small { padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  .turn { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; }
  .label { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-top:8px; }
  .label:first-child { margin-top:0; } .turn p { margin:2px 0 0; white-space:pre-wrap; }
  .only { display:block; margin:10px 0 0; color:var(--muted); font-size:.92rem; } .only input { margin-right:6px; }
  #files { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 0 16px; }
  #files h2 { font-size:1rem; margin:0 0 6px; } #files ul { list-style:none; margin:8px 0 0; padding:0; }
  #files li { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line); }
  #files li span.size { color:var(--muted); font-size:.85rem; margin-left:6px; } #files .empty { color:var(--muted); font-size:.92rem; margin:6px 0 0; }
  #cancel { margin:0 0 12px; border-color:var(--danger); color:var(--danger); }
  #drop.over { outline:2px dashed var(--accent); }
  .note { color:var(--danger); font-size:.9rem; } audio { width:100%; margin-top:10px; } #status { color:var(--muted); min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>WaxalAgent</h1>
  <p class="sub">Hold the button and speak Wolof. You see what was heard, what the agent understood in English, and its answer.</p>
  <button id="talk" type="button">Hold to talk</button>
  <label class="only"><input type="checkbox" id="only"> Transcribe only: just show what was heard (no translation, no agent)</label>
  <form id="typed"><input type="text" id="line" placeholder="or type Wolof here" autocomplete="off"><button class="small">Send</button></form>
  <div id="status" role="status"></div>
  <button id="cancel" class="small" type="button" hidden>Stop</button>
  <section id="files" hidden>
    <h2>Library: the documents everybody can ask about</h2>
    <div id="driveinfo" hidden><span id="drivetext"></span> <button class="small" type="button" id="syncnow">Sync now</button></div>
    <div id="drop"><input type="file" id="pick" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xlsm,.csv,.txt,.md,.json">
      <span class="empty">or drop files here: the agent reads them for every person.</span></div>
    <ul id="filelist"></ul>
    <div id="filestatus" class="note" role="status"></div>
  </section>
  <div id="turns"></div>
</main>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const headers = (extra = {}) => ({ ...(token ? { 'x-token': token } : {}), ...extra });
const talk = document.getElementById('talk'), statusEl = document.getElementById('status'), turns = document.getElementById('turns');
let recorder = null, chunks = [], stream = null, startedAt = 0, discard = false, holding = false;
const MIN_MS = 800; // a click is not a message

function show(r) {
  const div = document.createElement('div'); div.className = 'turn';
  const add = (label, text, cls) => { if (!text) return;
    const l = document.createElement('div'); l.className = 'label'; l.textContent = label;
    const p = document.createElement('p'); p.textContent = text; if (cls) p.className = cls; div.append(l, p); };
  add('Heard (Wolof)', r.wolof); add('Understood (English)', r.english);
  add('Answer (English)', r.reply_english); add('Answer (Wolof)', r.reply_wolof);
  (r.notes || []).forEach(n => add('Note', n, 'note'));
  if (r.audio) { const a = document.createElement('audio'); a.controls = true; a.src = `data:${r.audio_type};base64,${r.audio}`; div.append(a); a.play().catch(() => {}); }
  turns.prepend(div);
  return div;
}

// Sound: an AudioContext started by the person's own click keeps playing when the tab is in the background (an <audio>
// element started later by the page is often blocked there). If it cannot play, the tab title says the answer is ready and
// the audio plays when the tab is shown again.
let audioCtx = null, pendingAudio = null;
const baseTitle = document.title;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch { /* falls back to <audio> */ }
}
async function playVoice(el, base64) {
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  try {
    if (!audioCtx || audioCtx.state !== 'running') throw new Error('audio locked');
    const buffer = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
    const source = audioCtx.createBufferSource(); source.buffer = buffer; source.connect(audioCtx.destination); source.start();
    return;
  } catch { /* try the element */ }
  try { await el.play(); }
  catch { pendingAudio = el; if (document.hidden) document.title = '🔊 Answer ready - ' + baseTitle; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { document.title = baseTitle;
  if (pendingAudio) { pendingAudio.play().catch(() => {}); pendingAudio = null; } } });

let controller = null;
const cancelBtn = document.getElementById('cancel');
function working(on) { talk.disabled = on; cancelBtn.hidden = !on; }
cancelBtn.addEventListener('click', () => { if (controller) controller.abort(); fetch('/api/stop', { method: 'POST', headers: headers() }).catch(() => {});
  statusEl.textContent = 'Stopped.'; });

// The texts are shown first; the voice is asked for afterwards, so a slow or failing speech service never delays the answer.
async function addVoice(div, text, signal) {
  const note = document.createElement('p'); note.className = 'note'; note.textContent = 'Preparing the voice…'; div.append(note);
  try {
    const res = await fetch('/api/speak', { method: 'POST', signal, headers: headers({ 'content-type': 'application/json' }), body: JSON.stringify({ text }) });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(r.detail || `Error ${res.status}`);
    if (!r.audio) throw new Error((r.notes || []).join(' ') || 'No voice.');
    const a = document.createElement('audio'); a.controls = true; a.src = `data:${r.audio_type};base64,${r.audio}`;
    note.replaceWith(a); await playVoice(a, r.audio);
  } catch (e) { note.textContent = e.name === 'AbortError' ? 'Voice stopped.' : 'No voice: ' + e.message; }
}

async function send(path, body, type) {
  working(true); statusEl.textContent = 'Working…'; controller = new AbortController();
  try {
    const res = await fetch(path + (path.includes('?') ? '&' : '?') + 'speak=0', { method: 'POST', signal: controller.signal, headers: headers({ 'content-type': type }), body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `Error ${res.status}`);
    const div = show(data); statusEl.textContent = '';
    if (data.reply_wolof) { cancelBtn.hidden = false; await addVoice(div, data.reply_wolof, controller.signal); }
  } catch (e) { if (e.name !== 'AbortError') statusEl.textContent = e.message; } finally { working(false); controller = null; }
}

const filesBox = document.getElementById('files'), fileList = document.getElementById('filelist'), fileStatus = document.getElementById('filestatus');
let driveMode = false;
function renderFiles(files) {
  fileList.replaceChildren(...files.map(f => { const li = document.createElement('li');
    const label = document.createElement('span'); label.textContent = f.name;
    const size = document.createElement('span'); size.className = 'size'; size.textContent = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1024)) + ' KB'; label.append(size);
    const del = document.createElement('button'); del.className = 'small'; del.type = 'button'; del.textContent = 'Delete';
    del.onclick = async () => { const r = await fetch('/api/files?name=' + encodeURIComponent(f.name), { method: 'DELETE', headers: headers() });
      const d = await r.json().catch(() => ({})); r.ok ? renderFiles(d.files) : fileStatus.textContent = d.detail || `Error ${r.status}`; };
    li.append(label); if (!driveMode) li.append(del); return li; }));
}
async function loadFiles() {
  try { const r = await fetch('/api/files', { headers: headers() }); const d = await r.json();
    if (d.enabled) { showDrive(d.drive); filesBox.hidden = false; renderFiles(d.files); } } catch { /* the list is a convenience */ }
}
// With Google Drive the administrators add and remove documents there: the page only shows the library and syncs on request.
function showDrive(drive) {
  driveMode = !!drive; document.getElementById('drop').hidden = driveMode; document.getElementById('driveinfo').hidden = !driveMode;
  if (!drive) return;
  const when = drive.last_sync ? 'last sync ' + new Date(drive.last_sync * 1000).toLocaleTimeString() : 'not synced yet';
  document.getElementById('drivetext').textContent = 'Documents come from Google Drive (' + when + ')' + (drive.error ? ': ' + drive.error : '.');
}
document.getElementById('syncnow').addEventListener('click', async () => {
  fileStatus.style.color = 'var(--muted)'; fileStatus.textContent = 'Syncing…';
  const r = await fetch('/api/sync', { method: 'POST', headers: headers() }); const d = await r.json().catch(() => ({}));
  if (!r.ok) { fileStatus.style.color = 'var(--danger)'; fileStatus.textContent = d.detail || `Error ${r.status}`; return; }
  showDrive(d.drive); renderFiles(d.files);
  fileStatus.textContent = `${d.added} added, ${d.updated} updated, ${d.removed} removed` + (d.skipped.length ? `, skipped: ${d.skipped.join('; ')}` : '');
});
async function uploadFiles(list) {
  fileStatus.textContent = '';
  for (const file of list) {
    fileStatus.style.color = 'var(--muted)'; fileStatus.textContent = `Uploading ${file.name}…`;
    const r = await fetch('/api/files?name=' + encodeURIComponent(file.name), { method: 'POST', headers: headers({ 'content-type': 'application/octet-stream' }), body: file });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { fileStatus.style.color = 'var(--danger)'; fileStatus.textContent = `${file.name}: ${d.detail || 'Error ' + r.status}`; return; }
    renderFiles(d.files);
  }
  fileStatus.textContent = '';
}
document.getElementById('pick').addEventListener('change', e => { uploadFiles([...e.target.files]); e.target.value = ''; });
const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => uploadFiles([...e.dataTransfer.files]));
loadFiles();

async function start() {
  if (recorder) return;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { statusEl.textContent = 'The microphone is not available (allow it, and use https or localhost).'; return; }
  if (!holding) { stream.getTracks().forEach(t => t.stop()); stream = null; return; } // released before the microphone was ready: a click
  chunks = []; recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => { stream.getTracks().forEach(t => t.stop()); const blob = new Blob(chunks, { type: recorder.mimeType }); recorder = null;
    if (discard) { statusEl.textContent = 'Cancelled: nothing was sent.'; return; }
    if (Date.now() - startedAt < MIN_MS || blob.size < 1000) { statusEl.textContent = 'Too short, nothing was sent: hold the button while you speak.'; return; }
    send(document.getElementById('only').checked ? '/api/transcribe' : '/api/turn', blob, blob.type || 'application/octet-stream'); };
  discard = false; startedAt = Date.now();
  recorder.start(); talk.classList.add('rec'); talk.textContent = 'Listening… release to send, move away to cancel'; statusEl.textContent = '';
}
function stop(cancel) { discard = !!cancel; if (recorder && recorder.state === 'recording') recorder.stop(); talk.classList.remove('rec'); talk.textContent = 'Hold to talk'; }

talk.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); holding = true; start(); });
talk.addEventListener('pointerup', () => { holding = false; stop(false); });
['pointerleave', 'pointercancel'].forEach(t => talk.addEventListener(t, () => { holding = false; stop(true); }));
document.getElementById('typed').addEventListener('submit', e => { e.preventDefault();
  unlockAudio(); const line = document.getElementById('line'); const text = line.value.trim(); if (!text) return; line.value = '';
  send('/api/text', JSON.stringify({ text }), 'application/json'); });
</script>
</body>
</html>
