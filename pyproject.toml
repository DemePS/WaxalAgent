[project]
name = "waxal-agent"
version = "0.1.0"
description = "A Wolof voice agent: Wolof speech in, an English agent (CodeAgent), Wolof speech out. A test page and WhatsApp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The agent engine, pinned to a commit of main (0.6.0 code; move to a tag once one exists).
    "codeagent @ git+https://github.com/DemePS/CodeAgent.git@dcdef6f0addfdd3bc6ce55426b51b70ef965f225",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",   # WhatsApp Cloud API calls
]

[project.optional-dependencies]
# The real Wolof models (milestone 2): heavy, installed only where they run.
# transformers and diffusers are pinned as Oolel-Voices' model card asks; the other engines work with them too.
models = ["torch", "transformers==4.46.3", "diffusers==0.29.0", "conformer==0.3.2", "librosa>=0.10.2", "numpy>=2.0.0",
          "soundfile", "sentencepiece", "protobuf", "accelerate", "torchcodec", "s3tokenizer", "num2words"]

[project.scripts]
waxal-agent = "waxal_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the git dependency above

[tool.hatch.build.targets.wheel]
packages = ["waxal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
